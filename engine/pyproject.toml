[project]
name = "snapd-invest-engine"
version = "0.1.0"
description = "Hybrid agentic trading engine for snapd-invest"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Torben Boeck" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "ccxt>=4.4",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapd_invest"]

# ----------------------------------------------------------------------------
# Ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "C4",         # comprehensions
    "UP",         # pyupgrade
    "RUF",        # ruff-specific
    "SIM",        # simplify
    "TID",        # tidy imports
    "TCH",        # type-checking
    "ARG",        # unused args
    "PTH",        # pathlib
    "ERA",        # eradicate (commented-out code)
    "PL",         # pylint subset
    "ANN",        # annotations
    "ASYNC",      # async checks
    "S",          # security (bandit-lite)
]
ignore = [
    "ANN401",     # allow Any in narrow cases
    "PLR0913",    # too many arguments (we use DI a lot)
    "S101",       # assert is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# mypy — type check
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "ccxt.*",
    "apscheduler.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=snapd_invest",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "saxo_live: requires real Saxo SIM credentials and SAXO_RUN_LIVE_TESTS=1 (deselect with -m 'not saxo_live')",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:pydantic",
]

[tool.coverage.run]
source = ["src/snapd_invest"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
